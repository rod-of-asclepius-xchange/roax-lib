[package]
name = "roax-canon"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Independent Rust implementation of ROAX-CANON/1"
repository = "https://github.com/rod-of-asclepius-xchange/roax-lib"

[dependencies]
base64 = "0.22.1"
getrandom = "0.3.3"
hex = "0.4.3"
jiff = { version = "=0.2.15", default-features = false, features = ["std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
thiserror = "2.0.12"
unicode-normalization = "=0.1.23"
uriparse = "=0.6.4"
url = "=2.4.1"

[dev-dependencies]
serde_json = { version = "1.0.140", features = ["arbitrary_precision"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
