# Gradle finds these JDKs when `-Proax.testJdk=<n>` asks for one that is not the toolchain default.
# The Homebrew layout is listed because that is what this repository was developed against; adding
# a path here is harmless when it does not exist.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@25,/opt/homebrew/opt/openjdk@17,/opt/homebrew/opt/openjdk
org.gradle.java.installations.auto-download=false
